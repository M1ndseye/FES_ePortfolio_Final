<title>M1ndseye Eye</title>

<link rel="icon" href="/favicon.ico" sizes="any" />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #060912; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .gaze-stage { position: fixed; inset: 0; overflow: hidden; isolation: isolate; display: grid; place-items: center; }
  #caustics { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(60% 50% at 50% 50%, #10244f, #060912); }
  .gaze-stage::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(90% 80% at 50% 50%, rgba(6,9,18,0) 40%, rgba(6,9,18,.78) 100%); }
  .eye-stage { position: relative; width: min(62vw, 520px); aspect-ratio: 1586 / 992; z-index: 2; pointer-events: none; }
  #cymatics { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
  .cym-score { position: fixed; z-index: 4; top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); margin: 0; font: 400 .78rem/1.2 "Roboto Condensed", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(160,215,255,.55); opacity: 0; transition: opacity .6s; pointer-events: none; }
  .cym-score.on { opacity: 1; }
  .cym-banner { position: fixed; z-index: 4; left: 50%; top: 22%; transform: translate(-50%, 8px); width: max-content; max-width: 86vw; margin: 0; text-align: center; font: 300 1.5rem/1.25 "Roboto Condensed", system-ui, sans-serif; letter-spacing: .04em; color: #e6f6ff; text-shadow: 0 0 18px rgba(110,215,255,.6); opacity: 0; transition: opacity .8s, transform .8s; pointer-events: none; }
  .cym-banner small { display: block; margin-top: 6px; font-size: .9rem; letter-spacing: .08em; color: rgba(190,225,255,.75); }
  .cym-banner.on { opacity: 1; transform: translate(-50%, 0); }
  .eye-stage { transition: transform 2.4s cubic-bezier(.2,.8,.2,1), filter 2.4s; }
  body.converging .eye-stage { transform: scale(1.1); filter: brightness(1.25) saturate(1.2); }
  .cym-conv { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity 1.2s; font-family: "Roboto Condensed", system-ui, sans-serif; text-align: center; color: #e6f6ff; }
  .cym-conv.on { opacity: 1; }
  .cym-conv__h { position: absolute; left: 0; right: 0; top: max(9vh, calc(env(safe-area-inset-top) + 56px)); margin: 0; font-weight: 300; font-size: clamp(2rem, 7vw, 3.2rem); letter-spacing: .04em; text-shadow: 0 0 22px rgba(110,215,255,.7); }
  .cym-conv__h small { display: block; font-size: .9rem; letter-spacing: .3em; text-transform: uppercase; color: rgba(190,225,255,.8); margin-bottom: 4px; }
  .cym-conv__row { position: absolute; left: 0; right: 0; bottom: max(14vh, calc(env(safe-area-inset-bottom) + 90px)); display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 0 20px; }
  .cym-conv.on .cym-conv__row button { pointer-events: auto; }
  .cym-conv__row button { font: 500 1rem "Roboto Condensed", system-ui, sans-serif; letter-spacing: .06em; padding: 12px 22px; border-radius: 999px; cursor: pointer; color: #f4f2fb; background: rgba(13,19,34,.6); border: 1px solid rgba(244,242,251,.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .cym-conv__row .cym-conv__share { background: linear-gradient(90deg, rgba(111,155,255,.85), rgba(255,157,66,.85)); border-color: transparent; color: #060912; font-weight: 600; }
  .cym-conv__note { position: absolute; left: 0; right: 0; bottom: max(9vh, calc(env(safe-area-inset-bottom) + 58px)); margin: 0; font-size: .85rem; color: rgba(190,225,255,.7); }
  .cym-score b { display: block; font-size: 1.6rem; font-weight: 300; letter-spacing: .02em; color: rgba(225,245,255,.85); }
  .eye-stage img, .eye-stage .eye3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @media (min-aspect-ratio: 1/1) { .eye-stage { width: min(40vw, 100vh * .75, 620px); } }
  .exit { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 5; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #f4f2fb; font: 400 1.4rem/1 system-ui, sans-serif; text-decoration: none; background: rgba(13,19,34,.55); border: 1px solid rgba(244,242,251,.18); opacity: 0; pointer-events: none; transition: opacity .4s; }
  .exit.show { opacity: .85; pointer-events: auto; }
  body.idle { cursor: none; }
</style>
</head>
<body data-saver>
<main class="gaze-stage">
  <canvas id="caustics" aria-hidden="true"></canvas>
  <canvas id="cymatics" aria-label="Cymatic patterns drift down. Tap one to complete it and hear its tone."></canvas>
  <div class="eye-stage" id="eye" role="img" aria-label="A prismatic glass mechanical eye that follows your finger"><img src="assets/eye/prismatic.webp" alt="" width="1400" height="875" /><canvas class="eye3d" data-eye3d="assets/mechanical-eye.glb" data-home data-dist="8.2" aria-hidden="true"></canvas></div>
</main>
<p class="cym-score" aria-live="polite">Harmonics<b>0</b></p>
<p class="cym-banner" aria-live="polite">Harmony round<small>Tap the two halves that make one pattern</small></p>
<div class="cym-conv" aria-live="polite">
  <h2 class="cym-conv__h"><small>100 harmonics</small>Harmonic Convergence</h2>
  <div class="cym-conv__row"><button type="button" class="cym-conv__share">Share: I've reached Convergence</button><button type="button" class="cym-conv__go">Keep playing</button></div>
  <p class="cym-conv__note"></p>
</div>
<script src="gaze.js?v=7" defer></script>
<script src="eye3d.js?v=11" defer></script>
<script src="sound.js?v=19" defer></script>
<script src="cymatics.js?v=12" defer></script>
<a class="exit" href="./" aria-label="Exit screensaver">&times;</a>
<script>
(function () {
  var x = document.querySelector(".exit"), t;
  function home() { location.href = "./"; }
  x.addEventListener("click", function (e) { e.preventDefault(); home(); });
  function show(v) { document.querySelectorAll(".exit,.vol").forEach(function (el) { el.classList.toggle("show", v); }); }
  function wake(e) { if (e && e.cymHit) return; show(true); document.body.classList.remove("idle"); clearTimeout(t); t = setTimeout(function () { show(false); document.body.classList.add("idle"); }, 2500); }
  ["pointermove", "pointerdown", "keydown"].forEach(function (n) { window.addEventListener(n, wake, { passive: true }); });
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") home(); });
  t = setTimeout(function () { document.body.classList.add("idle"); }, 2500);
})();
</script>
</body>
</html>
